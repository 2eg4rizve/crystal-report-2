<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link rel="stylesheet" href="css/app-nav.css"><link rel="stylesheet" href="css/admin.css"></head><body data-entity="products"><main class="admin-shell"><section class="card"><h1>Products controller</h1><form id="entityForm"><input id="editId" type="hidden"><label>Name<input id="name" maxlength="100" required></label><label>Unit price<input id="unitPrice" type="number" min="0.01" step="0.01" required></label><button>Save product</button><button id="cancelEdit" class="secondary" type="button" hidden>Cancel edit</button></form><hr><h2>Optional product filters</h2><form id="productFilterForm"><label>Product ID<input id="filterId" type="number" min="1"></label><label>Name<input id="filterName"></label><label>Minimum price<input id="filterMin" type="number" min="0" step="0.01"></label><label>Maximum price<input id="filterMax" type="number" min="0" step="0.01"></label><button>Apply filters</button><button id="clearFilters" class="secondary" type="button">Clear</button></form><p id="message" class="message"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Unit price</th><th>Created</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="js/app-nav.js"></script><script src="js/entity-page.js"></script></body></html>
