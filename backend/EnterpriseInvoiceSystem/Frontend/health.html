<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Health</title><link rel="stylesheet" href="css/app-nav.css"><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-shell"><section class="card"><h1>Health controller</h1><p id="health" class="message">Checking API...</p><button id="retry">Check again</button></section></main><script src="js/app-nav.js"></script><script>async function check(){var x=document.getElementById('health');x.textContent='Checking API...';try{var r=await fetch('/api/health');if(!r.ok)throw new Error('Health request failed.');var d=await r.json();x.textContent=d.application+' — '+d.status+' — '+new Date(d.utcTime).toLocaleString()}catch(e){x.textContent='API unavailable.'}}document.getElementById('retry').onclick=check;check();</script></body></html>
