<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Invoice</title><link rel="stylesheet" href="css/app-nav.css"><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-shell"><section class="card"><h1>Invoices controller</h1><form id="invoiceForm"><label>Invoice number<input id="invoiceNumber" maxlength="50" required></label><label>Invoice date<input id="invoiceDate" type="date" required></label><label>Customer<select id="customerId" required></select></label><label>Discount<input id="discount" type="number" min="0" step="0.01" value="0"></label><div style="width:100%"><h2>Product lines</h2><div id="lines"></div><button id="addLine" class="secondary" type="button">Add product</button></div><button type="submit">Create invoice</button></form><p id="message" class="message"></p></section></main><script src="js/app-nav.js"></script><script src="js/invoice-create.js"></script></body></html>
